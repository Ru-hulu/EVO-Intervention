[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-fail"
version = "0.1.0"
description = "Model-independent LLMD and ACC intervention signals from VLA-FAIL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["vla_fail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
