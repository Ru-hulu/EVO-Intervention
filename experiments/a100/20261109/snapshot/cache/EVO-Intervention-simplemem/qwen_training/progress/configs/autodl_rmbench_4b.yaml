# AutoDL: Qwen3.5-4B, independent STG/CNT, P reads current-step readouts only.
teacher: false
keyframes: none
count_feedback: false
count_reads_history: false
stage_reads_history: false
progress_reads_history: false
progress_reads_count: true
isolate_gdn: true
model: /root/autodl-tmp/models/Qwen3.5-4B
labels: /root/autodl-tmp/EVO-Intervention/outputs/rmbench/labels
data: /root/autodl-tmp/datasets/RMBench
out: /root/autodl-tmp/EVO-Intervention/outputs/progress/rmbench_4b_seg24_20261029

window: 15
chunk_size: 24       # 计算粒度；调大前先测真实 GPU 峰值显存
segment: 24
event_prob: 0.5
pause_prob: 0.2
speed_prob: 0.2
rewind_prob: 0.0
repeat_boost: 2.0
accumulate: 8
epochs: 100
iterations: 0       # epochs>0 selects epoch training
warmup: 50
head_lr: 1.0e-3
lr: 1.0e-4
gate_lr: 1.0e-5
count_mode: level

eval_every: 100
press_eval: true
best_metric: val/press_irregular/post_press_error
eval_episodes: 12
final_eval_episodes: 0
save_every: 200
workers: 2
