# AutoDL: ProPriMem Count / Order / State, epoch-based training.
suites: Count,Order,State
teacher: false
keyframes: none
count_feedback: false
count_reads_history: false
stage_reads_history: false
progress_reads_history: false
progress_reads_count: true
isolate_gdn: true
model: /root/autodl-tmp/models/Qwen3.5-4B
labels: /root/autodl-tmp/EVO-Intervention/outputs/proprimem/labels
data: /root/autodl-tmp/datasets/ProPriMem
out: /root/autodl-tmp/EVO-Intervention/outputs/progress/proprimem_4b_seg32_multi4_320_20261030

window: 15
chunk_size: 24       # 计算粒度；调大前先测真实 GPU 峰值显存
warmup_chunk_size: 24
train_chunk_size: 4
activation_checkpointing: false
image_max_width: 320
image_max_height: 240
drop_wrist: 0.0
segment: 32
segments_per_trajectory: 4
max_updates: 2735
resume: /root/autodl-tmp/EVO-Intervention/outputs/progress/proprimem_4b_seg24_multi4_20261030/step1.pt
event_prob: 0.5
pause_prob: 0.2
speed_prob: 0.2
rewind_prob: 0.0
repeat_boost: 2.0
accumulate: 8
epochs: 5
iterations: 0       # epochs>0 selects epoch training
warmup: 50
head_lr: 1.0e-3
lr: 1.0e-4
gate_lr: 1.0e-5
count_mode: level

eval_every: 100
eval_at_start: false
press_eval: true
best_metric: val/model/loss
eval_episodes: 0
final_eval_episodes: 0
save_every: 200
workers: 2
