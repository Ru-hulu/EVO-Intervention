# proposal_progress_v9 B 组：A 组（huawei_proprimem_speed.yaml）加新颖度写入门，其余完全相同。
suites: Count,Order,State
teacher: false
keyframes: none
count_feedback: false
count_reads_history: false
stage_reads_history: false
progress_reads_history: false
progress_reads_count: true
isolate_gdn: true
novelty_gate: true
novelty_low: 0.15    # 38 条验证轨迹原速 1−cos 的 p75
novelty_high: 0.39   # 同上，p95
model: /cache/cvpzhr/models/Qwen3.5-4B
labels: /cache/EVO-Intervention/outputs/proprimem/labels
data: /cache/EVO-Intervention/datasets/ProPriMem
out: /cache/EVO-Intervention/outputs/progress/v9_speed_novelty_20261101
init_from: /cache/EVO-Intervention/outputs/progress/proprimem_4b_resume1600_huawei_20261031/step1800.pt

window: 15
chunk_size: 24       # 计算粒度；调大前先测真实 GPU 峰值显存
warmup_chunk_size: 24
train_chunk_size: 4
activation_checkpointing: true
image_max_width: 320
image_max_height: 240
drop_wrist: 0.0
segment: 32
segments_per_trajectory: 4
epochs: 1
max_updates: 400
iterations: 0       # epochs>0 selects epoch training
event_prob: 0.5
pause_prob: 0.2
speed_prob: 0.2
rewind_prob: 0.0
speed_range: 2.0
repeat_boost: 2.0
accumulate: 8
warmup: 50
head_lr: 3.0e-4
lr: 3.0e-5
gate_lr: 3.0e-6
gate_l2: 1.0e-3      # Config 默认值已改成放开门，这里写明，保持这组实验的设置
count_mode: level

eval_every: 100
eval_at_start: false
press_eval: false
best_metric: val/model/loss
eval_episodes: 24
final_eval_episodes: 24
save_every: 100
workers: 2
