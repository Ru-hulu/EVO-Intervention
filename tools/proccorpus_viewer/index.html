<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProcCorpus Annotation Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d12; --panel:#151922; --line:#2a3140; --text:#f3f5f7; --muted:#9ba6b7; --accent:#8da8ff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,sans-serif; }
    main { width:min(1180px, calc(100% - 32px)); margin:32px auto 64px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:24px; }
    h1 { margin:0; font-size:28px; font-weight:600; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:12px; }
    .muted { color:var(--muted); }
    select { min-width:280px; max-width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .stat span { display:block; color:var(--muted); font-size:12px; }
    .stat strong { display:block; margin-top:4px; font-size:20px; font-weight:600; }
    .viewer { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
    .viewer-head { display:flex; justify-content:space-between; gap:20px; align-items:start; }
    .viewer-head h2 { margin:0 0 4px; font-size:18px; }
    #currentLabel { max-width:72ch; text-align:right; color:var(--accent); }
    .video-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0 12px; }
    .video-grid.single { grid-template-columns:1fr; max-width:500px; }
    .video-view { min-width:0; }
    video { display:block; width:100%; aspect-ratio:1; object-fit:contain; background:#050608; border-radius:8px; }
    .video-label { display:block; margin-top:6px; color:var(--muted); font-size:12px; text-align:center; }
    .playback { display:flex; align-items:center; gap:10px; margin:14px 0 4px; }
    .playback button,.playback select { background:#202633; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
    #videoStatus { color:var(--muted); }
    .timeline { position:relative; height:64px; margin:20px 0 12px; overflow:hidden; border-radius:8px; background:#202633; }
    .segment { position:absolute; top:0; bottom:0; min-width:2px; border:0; border-right:1px solid rgba(0,0,0,.28); padding:0; opacity:.8; }
    .segment:hover,.segment.active { opacity:1; box-shadow:inset 0 0 0 2px rgba(255,255,255,.75); }
    .axis { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
    input[type=range] { width:100%; margin:16px 0 6px; accent-color:var(--accent); }
    .frame-row { display:flex; justify-content:space-between; color:var(--muted); }
    table { width:100%; border-collapse:collapse; margin-top:26px; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; font-weight:500; }
    td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
    tr.active { background:#20283a; }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:9px; vertical-align:-1px; }
    .error { color:#ff9b9b; }
    @media (max-width:720px) { header { align-items:start; flex-direction:column; } .stats { grid-template-columns:repeat(2,1fr); } .viewer-head { flex-direction:column; } #currentLabel { text-align:left; } .video-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">Table30 · Open the drawer</div>
        <h1>ProcCorpus Annotation Viewer</h1>
        <div class="muted">逐帧查看 episode 的子任务标注与切换位置</div>
      </div>
      <label>Episode<br><select id="episodeSelect" aria-label="选择 episode"></select></label>
    </header>

    <div id="error" class="error" role="alert"></div>
    <section class="stats" aria-label="数据摘要">
      <div class="stat"><span>数据集 Episodes</span><strong id="episodeCount">—</strong></div>
      <div class="stat"><span>当前总帧数</span><strong id="frameCount">—</strong></div>
      <div class="stat"><span>标注区段</span><strong id="segmentCount">—</strong></div>
      <div class="stat"><span>当前帧</span><strong id="frameStat">—</strong></div>
    </section>

    <section class="viewer">
      <div class="viewer-head">
        <div><h2 id="episodeTitle">正在载入…</h2><div class="muted" id="taskName"></div><div class="muted" id="overallNotes"></div></div>
        <div id="currentLabel" aria-live="polite"></div>
      </div>
      <div class="video-grid" aria-label="三个同步视频视角">
        <div class="video-view"><video id="videoGlobal" muted playsinline preload="metadata"></video><span class="video-label">全局视角</span></div>
        <div class="video-view"><video id="videoRight" muted playsinline preload="metadata"></video><span class="video-label">右侧视角</span></div>
        <div class="video-view"><video id="videoWrist" muted playsinline preload="metadata"></video><span class="video-label">腕部视角</span></div>
      </div>
      <div class="playback">
        <button id="playButton" type="button">播放</button>
        <label>速度 <select id="speedSelect" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <span id="videoStatus"></span>
      </div>
      <div id="timeline" class="timeline" aria-label="子任务时间轴"></div>
      <div class="axis"><span>0</span><span id="axisEnd">—</span></div>
      <input id="frameSlider" type="range" min="0" max="0" value="0" aria-label="当前帧">
      <div class="frame-row"><span>拖动查看任意帧</span><strong id="frameReadout">帧 —</strong></div>

      <table>
        <thead><tr><th>#</th><th>子任务标注</th><th>帧区间</th><th>长度</th><th>备注</th></tr></thead>
        <tbody id="segmentRows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const select = document.getElementById('episodeSelect');
    const slider = document.getElementById('frameSlider');
    const videos = [
      document.getElementById('videoGlobal'),
      document.getElementById('videoRight'),
      document.getElementById('videoWrist'),
    ];
    const playButton = document.getElementById('playButton');
    let current = null;

    function colorFor(text) {
      let hash = 0;
      for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return `hsl(${hash % 360} 58% 52%)`;
    }

    function activeSegment(frame) {
      return current.segments.findIndex(s => frame >= s.start && frame < s.end);
    }

    function updateFrameUi(frame, scrollRow = false) {
      frame = Math.max(0, Math.min(current.frames - 1, Number(frame)));
      slider.value = frame;
      const index = activeSegment(frame);
      const segment = current.segments[index];
      document.getElementById('frameStat').textContent = frame.toLocaleString();
      document.getElementById('frameReadout').textContent = `帧 ${frame.toLocaleString()} / ${(current.frames - 1).toLocaleString()}`;
      document.getElementById('currentLabel').textContent = segment ? segment.label : '未标注';
      document.querySelectorAll('.segment').forEach((el, i) => el.classList.toggle('active', i === index));
      document.querySelectorAll('#segmentRows tr').forEach((el, i) => el.classList.toggle('active', i === index));
      if (scrollRow) document.querySelector(`#segmentRows tr[data-index="${index}"]`)?.scrollIntoView({block:'nearest'});
    }

    function setFrame(frame, scrollRow = false) {
      updateFrameUi(frame, scrollRow);
      const time = Number(frame) / current.fps;
      for (const video of videos.filter(video => video.getAttribute('src'))) {
        if (Math.abs(video.currentTime - time) > 0.015) video.currentTime = time;
      }
    }

    function pauseAll() {
      videos.forEach(video => video.pause());
      playButton.textContent = '播放';
    }

    async function playAll() {
      const available = videos.filter(video => video.getAttribute('src'));
      if (!available.length) return;
      const time = available[0].currentTime;
      available.slice(1).forEach(video => video.currentTime = time);
      try {
        await Promise.all(available.map(video => video.play()));
        playButton.textContent = '暂停';
      } catch (error) {
        document.getElementById('videoStatus').textContent = `播放失败：${error.message}`;
      }
    }

    function renderEpisode(data) {
      pauseAll();
      current = data;
      document.getElementById('episodeTitle').textContent = data.id;
      document.getElementById('taskName').textContent = data.task;
      document.getElementById('overallNotes').textContent = data.overall_notes || '';
      document.getElementById('frameCount').textContent = data.frames.toLocaleString();
      document.getElementById('segmentCount').textContent = data.segments.length.toLocaleString();
      document.getElementById('axisEnd').textContent = `${data.frames.toLocaleString()} 帧`;
      slider.max = Math.max(0, data.frames - 1);
      const sources = [data.videos.global, data.videos.right, data.videos.wrist];
      document.querySelector('.video-grid').classList.toggle('single', sources.filter(Boolean).length === 1);
      videos.forEach((video, index) => {
        video.parentElement.hidden = !sources[index];
        if (sources[index]) video.src = sources[index];
        else video.removeAttribute('src');
        video.load();
      });
      document.getElementById('videoStatus').textContent = `${sources.filter(Boolean).length} 个视角 · ${data.fps} FPS`;
      const timeline = document.getElementById('timeline');
      const rows = document.getElementById('segmentRows');
      timeline.replaceChildren();
      rows.replaceChildren();
      data.segments.forEach((s, i) => {
        const color = colorFor(s.label);
        const button = document.createElement('button');
        button.className = 'segment';
        button.style.left = `${100 * s.start / data.frames}%`;
        button.style.width = `${100 * (s.end - s.start) / data.frames}%`;
        button.style.background = color;
        button.title = `${s.label} · [${s.start}, ${s.end})${s.notes ? ` · ${s.notes}` : ''}`;
        button.setAttribute('aria-label', button.title);
        button.addEventListener('click', () => setFrame(s.start, true));
        timeline.append(button);

        const tr = document.createElement('tr');
        tr.dataset.index = i;
        tr.innerHTML = `<td class="num">${i + 1}</td><td><span class="swatch" style="background:${color}"></span>${escapeHtml(s.label)}</td><td class="num">[${s.start}, ${s.end})</td><td class="num">${(s.end - s.start).toLocaleString()}</td><td>${escapeHtml(s.notes || '')}</td>`;
        tr.addEventListener('click', () => setFrame(s.start));
        rows.append(tr);
      });
      setFrame(0);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadEpisode(id) {
      document.getElementById('error').textContent = '';
      try {
        const response = await fetch(`/api/episodes/${encodeURIComponent(id)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderEpisode(await response.json());
      } catch (error) {
        document.getElementById('error').textContent = `载入失败：${error.message}`;
      }
    }

    async function init() {
      try {
        const response = await fetch('/api/episodes');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const {episodes} = await response.json();
        document.getElementById('episodeCount').textContent = episodes.length.toLocaleString();
        for (const item of episodes) {
          const option = document.createElement('option');
          option.value = item.id;
          option.textContent = `${item.id} · ${item.frames.toLocaleString()} 帧 · ${item.segments} 段`;
          select.append(option);
        }
        if (episodes.length) loadEpisode(episodes[0].id);
      } catch (error) {
        document.getElementById('error').textContent = `数据集列表载入失败：${error.message}`;
      }
    }

    select.addEventListener('change', () => loadEpisode(select.value));
    slider.addEventListener('input', () => setFrame(slider.value));
    playButton.addEventListener('click', () => videos[0].paused ? playAll() : pauseAll());
    document.getElementById('speedSelect').addEventListener('change', event => {
      videos.forEach(video => video.playbackRate = Number(event.target.value));
    });
    videos.forEach(video => video.addEventListener('click', () => videos[0].paused ? playAll() : pauseAll()));
    videos[0].addEventListener('timeupdate', () => {
      if (!current || videos[0].paused) return;
      const frame = Math.min(current.frames - 1, Math.round(videos[0].currentTime * current.fps));
      updateFrameUi(frame);
      videos.slice(1).forEach(video => {
        if (Math.abs(video.currentTime - videos[0].currentTime) > 0.08) video.currentTime = videos[0].currentTime;
      });
    });
    videos[0].addEventListener('ended', pauseAll);
    init();
  </script>
</body>
</html>
